services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      LISTEN_ADDRESS: ":8080"
      SHUTDOWN_TIMEOUT: "10s"
      READ_TIMEOUT: "5s"
      WRITE_TIMEOUT: "10s"
      IDLE_TIMEOUT: "120s"
      REQUEST_TIMEOUT: "30s"
      ALLOWED_ORIGIN: "http://localhost:5173"
    restart: unless-stopped
