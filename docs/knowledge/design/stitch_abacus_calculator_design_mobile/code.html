                    0
                </div>

<!-- Interaction Controls -->
<div class="p-6 space-y-6">
<!-- Inputs Section -->
<div class="space-y-4">
<div class="space-y-1">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Operand 1</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border-2 border-surface-variant focus:border-primary focus:ring-0 rounded-lg p-4 font-display-results-mobile text-display-results-mobile transition-all outline-none" id="op1" placeholder="0" type="number"/>

<button class="operator-button h-14 rounded-lg bg-surface-container-high text-on-surface font-headline-md flex items-center justify-center transition-all active:scale-90" data-op="-" onclick="setOperator('-')">

</button>
<button class="operator-button h-14 rounded-lg bg-surface-container-high text-on-surface font-headline-md flex items-center justify-center transition-all active:scale-90" data-op="*" onclick="setOperator('*')">
<span class="material-symbols-outlined">close</span>
</button>
<button class="operator-button h-14 rounded-lg bg-surface-container-high text-on-surface font-headline-md flex items-center justify-center transition-all active:scale-90" data-op="/" onclick="setOperator('/')">
<span class="material-symbols-outlined">horizontal_rule</span>
</button>

<!-- Logic Script -->
<script>
        let currentOperator = null;

        function setOperator(op) {
            currentOperator = op;
            
            // UI Visual State
            document.querySelectorAll('.operator-button').forEach(btn => {
                btn.classList.remove('active');
                if(btn.dataset.op === op) {
                    btn.classList.add('active');
                }
            });

            // Smooth focus transition
            setTimeout(() => {
                document.getElementById('op2').focus();
            }, 100);

            updatePreview();
        }

        function updatePreview() {
            const val1 = document.getElementById('op1').value || '0';
            const val2 = document.getElementById('op2').value || '';
            const preview = document.getElementById('calculation-preview');
            
            if (currentOperator) {
                preview.textContent = `${val1} ${currentOperator} ${val2}`;
            } else {
                preview.textContent = val1;
            }
        }

        function calculate() {
            const val1 = parseFloat(document.getElementById('op1').value);
            const val2 = parseFloat(document.getElementById('op2').value);
            const display = document.getElementById('display');

            if (isNaN(val1) || isNaN(val2) || !currentOperator) {
                display.classList.add('text-error');
                display.textContent = 'Error';
                setTimeout(() => display.classList.remove('text-error'), 500);
                return;
            }

            let result;
            switch(currentOperator) {
                case '+': result = val1 + val2; break;
                case '-': result = val1 - val2; break;
                case '*': result = val1 * val2; break;
                case '/': result = val2 !== 0 ? val1 / val2 : 'Div 0'; break;
            }

            // Handle precision
            if (typeof result === 'number') {
                result = Number(result.toFixed(8)).toString();
            }

            display.textContent = result;
            updatePreview();
        }

        function clearCalculator() {
            document.getElementById('op1').value = '';
            document.getElementById('op2').value = '';
            document.getElementById('display').textContent = '0';
            document.getElementById('calculation-preview').textContent = '';
            currentOperator = null;
            document.querySelectorAll('.operator-button').forEach(btn => btn.classList.remove('active'));
            document.getElementById('op1').focus();
        }

        // Real-time preview listeners
        document.getElementById('op1').addEventListener('input', updatePreview);
        document.getElementById('op2').addEventListener('input', updatePreview);

        // Haptic-like feedback on touch
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                if (window.navigator.vibrate) window.navigator.vibrate(5);
            });
        });
    </script>
